<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="360" viewBox="0 0 1200 360" style="background:#090d16;border-radius:12px;font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,sans-serif"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0a0f1d"/><stop offset="50%" stop-color="#0d1527"/><stop offset="100%" stop-color="#050811"/></linearGradient><linearGradient id="accentGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#6366f1"/><stop offset="50%" stop-color="#06b6d4"/><stop offset="100%" stop-color="#10b981"/></linearGradient><radialGradient id="glowPulse" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#06b6d4" stop-opacity=".3"/><stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/></radialGradient><filter id="dropShadow" width="120%" height="120%" x="-10%" y="-10%"><feDropShadow dx="0" dy="8" flood-color="#000" flood-opacity=".5" stdDeviation="6"/></filter></defs><style>@keyframes pulseGlow{0%{opacity:.25;transform:scale(1)}50%{opacity:.55;transform:scale(1.08)}}@keyframes floatParticle{0%{transform:translateY(0) translateX(0);opacity:.3}50%{transform:translateY(-12px) translateX(6px);opacity:.8}}@keyframes packetFlow{0%{stroke-dashoffset:240}}@keyframes pulseRing{0%{r:6px;opacity:.9}50%{r:12px;opacity:.3}}.bg-grid{stroke:rgba(255,255,255,.04);stroke-width:1}.node-orbit{animation:pulseGlow 6s ease-in-out infinite;transform-origin:center}.particle{animation:floatParticle 4s ease-in-out infinite}.stream-line{stroke-dasharray:8 12;animation:packetFlow 4s linear infinite}.node-ping{animation:pulseRing 3s ease-in-out infinite}.badge-tag{fill:rgba(99,102,241,.15);stroke:rgba(99,102,241,.4);rx:14}</style><rect width="1200" height="360" fill="url(#bgGrad)" rx="12"/><g class="bg-grid"><line x1="100" x2="100" y1="0" y2="360"/><line x1="250" x2="250" y1="0" y2="360"/><line x1="400" x2="400" y1="0" y2="360"/><line x1="550" x2="550" y1="0" y2="360"/><line x1="700" x2="700